plugins {
    id 'com.android.library'
    id 'maven-publish'
}

/*
 * The goal of this code is to publish only the release variant of a library. The artifact is
 * packaged together with its Javadoc and Sources for easy reference.
 *
 * Until version 1.x this code created the Javadoc and sources tasks and the POM dependencies itself
 * with `android.libraryVariants`. AGP 9 removed this API. Since version 2.0.0 the publication uses
 * the software component `release` of AGP: AGP creates the Javadoc JAR (with Dokka, also for
 * Kotlin), the sources JAR and the POM with the `api` and `implementation` dependencies.
 */
android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    // Authenticate at the repository
    repositories {
        maven {
            url = uri("https://maven.pkg.github.com/cyface-de/android-backend")
            credentials {
                username = project.findProperty("githubUser").toString()
                password = project.findProperty("githubToken").toString()
            }
        }
    }
}

// AGP creates the component `release` and the library sets the `versionName` after this plugin is applied
afterEvaluate {
    publishing {
        publications {
            // The name results in the task `publish<Module>ReleasePublicationToMavenRepository`, like in version 1.x
            "${project.name}Release"(MavenPublication) {
                from components.release
                groupId = 'de.cyface'
                artifactId = project.name
                version = android.defaultConfig.versionName
            }
        }
    }
}
